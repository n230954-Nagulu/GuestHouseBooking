name: Validate Guest House Booking

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: Guest-House-Booking
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
        run: |
          npm ci
          npm run build
      - name: Install backend production dependencies
        working-directory: TrailOne
        run: npm ci --omit=dev
